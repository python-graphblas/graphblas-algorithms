name: Publish to PyPI

on:
  push:
    tags:
      - "20*"

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'python-graphblas/graphblas-algorithms'
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build wheel and sdist
        run: python -m build --sdist --wheel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: releases
          path: dist
          if-no-files-found: error
      - name: Check with twine
        run: python -m twine check --strict dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }} # zizmor: ignore[use-trusted-publishing]
